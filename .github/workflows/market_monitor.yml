name: NSE Market Monitor

on:
  schedule:
    # Every 15 min, Mon-Fri, 3:00-10:59 UTC = 8:30am-4:29pm IST
    # is_market_open() in the agent handles exact NSE open/close times
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write # needed to commit state back to repo

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.run

      - name: Commit updated state + logs
        run: |
          git config user.name "nse-agent[bot]"
          git config user.email "nse-agent@users.noreply.github.com"
          git add state/ logs/
          if ! git diff --staged --quiet; then
            git commit -m "chore: cycle $(date -u '+%Y-%m-%dT%H:%MZ')"
            git push
          fi
