name: NSE Weekly Long-Term Monitor

on:
  schedule:
    # Every Saturday at 08:00 IST (02:30 UTC)
    - cron: '30 2 * * 6'
  workflow_dispatch: # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly long-term analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.run_weekly

      - name: Commit updated state + logs
        run: |
          git config user.name "nse-agent[bot]"
          git config user.email "nse-agent@users.noreply.github.com"
          git add state/ logs/
          if ! git diff --staged --quiet; then
            git commit -m "chore: weekly cycle $(date -u '+%Y-%m-%dT%H:%MZ')"
            git push
          fi
